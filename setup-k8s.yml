# 🖥️ Set the hostname of each node based on its inventory name
- name: Change hostnames based on inventory names
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Set hostname using hostnamectl
      ansible.builtin.command:
        cmd: hostnamectl set-hostname "{{ inventory_hostname }}"

    - name: Ensure /etc/hostname is correct
      ansible.builtin.copy:
        dest: /etc/hostname
        content: "{{ inventory_hostname }}\n"
        owner: root
        group: root
        mode: '0644'

    - name: Update /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_host }} {{ inventory_hostname }}"
        state: present

# 🔥 Disable the firewall (UFW) on Debian/Ubuntu systems
- name: Disable firewall
  hosts: all
  become: true
  tasks:
    - name: Stop and disable ufw 
      service:
        name: ufw
        state: stopped
        enabled: no
      when: ansible_facts['os_family'] == 'Debian'

# 🧹 Disable swap to meet Kubernetes requirements
- name: Disable swap
  hosts: all
  become: true
  tasks:
    - name: Turn off swap
      command: swapoff -a

    - name: Remove swap entry from /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        replace: ''

# 🧱 Load required kernel modules for Kubernetes and containerd
- name: Load kernel modules
  hosts: all
  become: true
  tasks:
    - name: Ensure br_netfilter module is loaded
      modprobe:
        name: br_netfilter
        state: present

    - name: Ensure overlay module is loaded
      modprobe:
        name: overlay
        state: present

    - name: Persist modules across reboots
      copy:
        dest: /etc/modules-load.d/containerd.conf
        content: |
          overlay
          br_netfilter

# 📦 Install containerd using Docker's official repository and keyring
- name: Install containerd with Docker repo and keyring
  hosts: all
  become: true
  tasks:
    # Install required dependencies
    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    # Create directory for storing GPG key
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Download Docker GPG key and save it to keyring
#    - name: Download Docker GPG key and save to keyring
#      shell: |
#        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
#      args:
#        creates: /etc/apt/keyrings/docker.gpg

    # Add Docker repository to APT sources
#    - name: Add Docker repository to APT sources
#      copy:
#        dest: /etc/apt/sources.list.d/docker.list
#        content: |
#          deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable

    # Update APT package index
    - name: Update APT cache
      apt:
        update_cache: yes

    # Install containerd package
    - name: Install containerd
      apt:
        name: containerd.io
        state: present

    # Generate default containerd configuration file
    - name: Generate default containerd config
      shell: containerd config default | tee /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    # Enable and restart containerd service
    - name: Restart containerd service
      service:
        name: containerd
        state: restarted
        enabled: yes


# 📚 Add Kubernetes APT repository and install kubelet, kubeadm, and kubectl
- name: Add Kubernetes apt repository
  hosts: all
  become: true
  tasks:
    # Add Kubernetes GPG key
    - name: Add GPG key
      apt_key:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        state: present

    # Add Kubernetes repository to APT sources
    - name: Add Kubernetes repo
      apt_repository:
        repo: deb https://apt.kubernetes.io/ kubernetes-xenial main
        state: present

    # Install Kubernetes components
    - name: Install kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    # Prevent automatic updates of Kubernetes packages
    - name: Hold Kubernetes packages
      shell: apt-mark hold kubelet kubeadm kubectl

